    <clipPath id="cLoopClip">
      <path d="M 524 265 L 524 263 L 517 256 L 514 251 L 482 213 L 456 225 L 440 229 L 435 229 L 434 230 L 407 230 L 406 229 L 401 229 L 389 226 L 374 219 L 359 208 L 347 194 L 338 176 L 338 172 L 336 168 L 335 158 L 334 157 L 335 134 L 338 122 L 342 112 L 348 101 L 355 92 L 365 82 L 372 77 L 387 71 L 400 68 L 405 68 L 406 67 L 428 67 L 429 68 L 434 68 L 450 72 L 462 77 L 475 85 L 477 84 L 524 34 L 522 31 L 513 25 L 494 15 L 479 10 L 476 8 L 456 3 L 434 1 L 433 0 L 414 0 L 413 1 L 395 2 L 394 3 L 389 3 L 372 7 L 354 13 L 338 21 L 336 21 L 322 29 L 304 42 L 278 67 L 261 88 L 206 166 L 196 152 L 186 135 L 183 132 L 177 121 L 170 112 L 168 107 L 122 37 L 121 34 L 107 15 L 0 15 L 3 21 L 20 45 L 21 48 L 43 80 L 44 83 L 47 86 L 70 123 L 73 126 L 74 129 L 88 149 L 89 152 L 97 163 L 107 180 L 110 183 L 116 194 L 119 197 L 125 208 L 128 211 L 129 214 L 176 287 L 210 287 L 213 284 L 214 281 L 273 191 L 275 194 L 276 200 L 280 210 L 289 227 L 299 241 L 311 254 L 319 261 L 338 274 L 356 283 L 373 289 L 389 293 L 394 293 L 395 294 L 415 295 L 416 296 L 428 296 L 429 295 L 441 295 L 442 294 L 457 293 L 469 289 L 473 289 L 488 284 L 493 281 L 498 280 Z" />
    </clipPath>

    <!-- Natural drop shadow for the 3D ribbon fold -->
    <filter id="foldShadowFilter" x="-20%" y="-20%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.25   0 0 0 0 0.06   0 0 0 0 0   0 0 0 0.85 0" />
    </filter>
  </defs>

  <g id="vce-logo-group">
