<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 783 297" width="100%" height="100%">
  <defs>
    <!-- Master Brand Gradients matching the original Pali e-Gram VCE brand -->
    <linearGradient id="vceGradC" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFB300" />
      <stop offset="35%" stop-color="#FF8A00" />
      <stop offset="70%" stop-color="#FF5722" />
      <stop offset="100%" stop-color="#DD2C00" />
    </linearGradient>

    <linearGradient id="vceGradV" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA000" />
      <stop offset="45%" stop-color="#FF5722" />
      <stop offset="100%" stop-color="#E63900" />
    </linearGradient>

    <linearGradient id="vceGradE1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5722" />
      <stop offset="100%" stop-color="#FFB300" />
    </linearGradient>

    <linearGradient id="vceGradE2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5722" />
      <stop offset="100%" stop-color="#FFB300" />
    </linearGradient>

    <linearGradient id="vceGradE3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E63900" />
      <stop offset="100%" stop-color="#FFA000" />
    </linearGradient>

