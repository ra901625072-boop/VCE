      <path d="M 0 15 L 107 15 L 178 125 L 181 129 L 184 133 L 186 137 L 189 141 L 191 145 L 194 149 L 197 153 L 199 157 L 202 161 L 204 165 L 207 169 L 209 173 L 212 177 L 215 181 L 217 185 L 220 189 L 222 193 L 225 197 L 227 201 L 230 205 L 233 209 L 235 213 L 238 217 L 240 221 L 243 225 L 245 229 L 245 233 L 242 237 L 240 241 L 237 245 L 235 249 L 232 253 L 230 257 L 227 261 L 224 265 L 222 269 L 219 273 L 217 277 L 214 281 L 211 285 L 211 286 L 176 287 L 0 15 Z" fill="#000000" transform="translate(6, 2)" filter="url(#foldShadowFilter)" />
    </g>

    <!-- Front Diagonal V Arm (clean, crisp edge on top) -->
    <path d="M 0 15 L 107 15 L 178 125 L 181 129 L 184 133 L 186 137 L 189 141 L 191 145 L 194 149 L 197 153 L 199 157 L 202 161 L 204 165 L 207 169 L 209 173 L 212 177 L 215 181 L 217 185 L 220 189 L 222 193 L 225 197 L 227 201 L 230 205 L 233 209 L 235 213 L 238 217 L 240 221 L 243 225 L 245 229 L 245 233 L 242 237 L 240 241 L 237 245 L 235 249 L 232 253 L 230 257 L 227 261 L 224 265 L 222 269 L 219 273 L 217 277 L 214 281 L 211 285 L 211 286 L 176 287 L 0 15 Z" fill="url(#vceGradV)" />

    <!-- E Bar Top -->
    <polygon points="499,83 720,83 781,14 563,14" fill="url(#vceGradE1)" />

    <!-- E Bar Middle -->
    <polygon points="525,183 666,184 719,123 525,123" fill="url(#vceGradE2)" />

    <!-- E Bar Bottom -->
    <polygon points="510,224 562,287 715,287 776,224" fill="url(#vceGradE3)" />
  </g>
</svg>
