<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Center Expenses — VCE Pali e-Gram</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link rel="apple-touch-icon" href="/assets/vce-icon-256.png" />
  <!-- Curated Google Fonts: Plus Jakarta Sans + Inter + JetBrains Mono + Noto Sans Gujarati -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Noto+Sans+Gujarati:wght@500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/reset.css" />
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/animations.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
  <link rel="stylesheet" href="/css/print.css" />
  <script>
    (function() {
      const saved = localStorage.getItem('vce_theme');
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = saved || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
      if (typeof window.AndroidBridge !== 'undefined' || navigator.userAgent.includes('VCE-Android-Native') || window.location.search.includes('native=true')) {
        document.documentElement.classList.add('is-native-app');
      }
    })();
  </script>
</head>
<body data-page="expenses">
  <div class="app-container">
    <div id="sidebar-container"></div>

    <div class="main-wrapper">
      <header class="topbar">
        <div class="topbar-left">
          <div class="topbar-title-group">
            <h1 class="topbar-title">Expenses <span class="desktop-only-inline">(કેન્દ્ર ખર્ચ)</span></h1>
            <span class="topbar-subtitle">Stationery, printer paper, toner, electricity, and center overheads</span>
          </div>
        </div>
        <div class="topbar-right">
          <button class="btn-theme-toggle" id="btn-theme-switch-top" title="Toggle Theme" aria-label="Toggle Theme">
            <span class="theme-icon sun-icon">☀️</span>
            <span class="theme-icon moon-icon">🌙</span>
            <span class="theme-text">Mode</span>
          </button>
          <button class="btn btn-danger" id="btn-add-exp-top" style="font-weight:700;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span>Add Expense</span>
          </button>
        </div>
      </header>

      <main class="content-area">
        <!-- Filter Bar -->
        <div class="card filter-bar-shell" style="margin-bottom:1.65rem;">
          <div class="card-body" style="display:flex; flex-wrap:wrap; gap:1.15rem; align-items:center; justify-content:space-between; padding:1.25rem 1.65rem;">
            <div style="flex:1; min-width:240px; position:relative;">
              <input type="text" id="exp-search-input" class="form-control" placeholder="Search expense items, vendors, or notes..." style="padding-left:2.6rem;" />
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2" style="position:absolute; left:0.95rem; top:50%; transform:translateY(-50%); pointer-events:none;"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </div>
            <div style="display:flex; flex-wrap:wrap; gap:0.75rem;">
              <select id="exp-category-filter" class="form-select" style="width:auto; padding:0.55rem 0.95rem; font-size:0.85rem; font-weight:600;">
                <option value="">All Categories</option>
              </select>
              <select id="exp-method-filter" class="form-select" style="width:auto; padding:0.55rem 0.95rem; font-size:0.85rem; font-weight:600;">
                <option value="">All Methods</option>
                <option value="Cash">Cash (રોકડ)</option>
                <option value="Online">Online</option>
                <option value="UPI">UPI</option>
                <option value="Bank Transfer">Bank Transfer</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Expense Table -->
        <div class="card">
          <div class="card-header">
            <div style="display:flex; align-items:center; gap:0.75rem;">
              <h2 class="card-title">Expense Records (જાવક નોંધ)</h2>
              <span id="exp-count-badge" class="badge badge-waiting font-tabular">0 records</span>
            </div>
            <span id="exp-total-badge" class="badge badge-cancelled font-tabular" style="font-size:0.85rem; padding:0.35rem 0.75rem;">Total: ₹0.00</span>
          </div>
          <div class="table-container hide-on-mobile">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Date & Time</th>
                  <th>Item & Vendor</th>
                  <th>Category</th>
                  <th>Method</th>
                  <th style="text-align:right;">Amount (₹)</th>
                </tr>
              </thead>
              <tbody id="expenses-table-body">
                <tr><td colspan="5" style="text-align:center; padding:3rem; color:var(--text-muted);">Loading expenses...</td></tr>
              </tbody>
            </table>
          </div>
          <!-- Mobile Card List for Smartphones -->
          <div class="mobile-card-list" id="mobile-expenses-list" style="padding:0.75rem;"></div>
        </div>
      </main>
    </div>
  </div>

  <div id="mobile-bottom-nav-container"></div>
  <div id="modal-container"></div>
  <div id="notification-container"></div>

  <script type="module" src="/js/app.js"></script>
  <script type="module" src="/js/expenses.js"></script>
</body>
</html>
