<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#121214" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Transactions & Ledger — VCE Pali e-Gram</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link rel="apple-touch-icon" href="/assets/vce-icon-256.png" />
  <!-- Curated Google Fonts: Plus Jakarta Sans + Inter + JetBrains Mono + Noto Sans Gujarati -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Noto+Sans+Gujarati:wght@500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/reset.css" />
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/animations.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
  <link rel="stylesheet" href="/css/print.css" />
  <script>
    (function() {
      const saved = localStorage.getItem('vce_theme');
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = saved || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
      if (typeof window.AndroidBridge !== 'undefined' || navigator.userAgent.includes('VCE-Android-Native') || window.location.search.includes('native=true')) {
        document.documentElement.classList.add('is-native-app');
      }
    })();
  </script>
</head>
<body data-page="transactions">
  <div class="app-container">
    <div id="sidebar-container"></div>

    <div class="main-wrapper">
      <header class="topbar">
        <div class="topbar-left">
          <div class="topbar-title-group">
            <h1 class="topbar-title">Transactions <span class="desktop-only-inline">&amp; Cash Flow</span></h1>
            <span class="topbar-subtitle">Receipts, citizen fee settlements, and center expense journal</span>
          </div>
        </div>
        <div class="topbar-right">
          <button class="btn-theme-toggle" id="btn-theme-switch-top" title="Toggle Theme" aria-label="Toggle Theme">
            <span class="theme-icon sun-icon">☀️</span>
            <span class="theme-icon moon-icon">🌙</span>
            <span class="theme-text">Mode</span>
          </button>
          <button class="btn btn-success btn-sm" id="btn-add-pay-top" title="Record Receipt (આવક)" aria-label="Record Receipt" style="font-weight:700;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
            <span class="desktop-only-inline">Record Receipt</span>
          </button>
          <button class="btn btn-danger btn-sm" id="btn-add-exp-top" title="Record Expense (જાવક)" aria-label="Record Expense" style="font-weight:700;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
            <span class="desktop-only-inline">Record Expense</span>
          </button>
        </div>
      </header>

      <main class="content-area">
        <!-- Multi-Filter Control Panel -->
        <div class="card" style="margin-bottom:1.25rem;">
          <div class="card-body" style="padding:1rem 1.25rem;">
            <!-- Filter Tabs -->
            <div class="trans-tab-strip">
              <button class="btn btn-primary btn-sm trans-tab active" data-type="all">All Cash Flow</button>
              <button class="btn btn-outline btn-sm trans-tab" data-type="payment">Receipts (આવક)</button>
              <button class="btn btn-outline btn-sm trans-tab" data-type="expense">Expenses (જાવક)</button>
              <button class="btn btn-outline btn-sm trans-tab" data-type="udhar">Udhar (ઉધાર)</button>
            </div>

            <!-- Search Query & Mobile Filter Toggle Button -->
            <div class="trans-search-row" style="display:flex; gap:0.5rem; align-items:center;">
              <div style="position:relative; flex:1;">
                <input type="text" id="filter-query" class="form-control" placeholder="Search citizen, vendor, receipt no, details..." style="padding-left:2.4rem;" />
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2" style="position:absolute; left:0.85rem; top:50%; transform:translateY(-50%); pointer-events:none;"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              </div>
              <button type="button" class="btn btn-outline btn-sm trans-filter-toggle-btn" id="btn-toggle-filters" title="Toggle More Filters" aria-label="Toggle More Filters">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
                <span>Filters</span>
                <span id="filter-active-badge" class="badge badge-primary font-tabular" style="display:none; font-size:0.65rem; padding:0.1rem 0.35rem; margin-left:0.2rem;">0</span>
              </button>
            </div>

            <!-- Collapsible Secondary Filter Drawer -->
            <div id="trans-filter-collapsible" class="trans-filter-collapsible is-collapsed">
              <div class="trans-secondary-grid" style="margin-top:0.85rem; display:grid; grid-template-columns: 2fr 1fr 1fr; gap:0.85rem; align-items:end;">
                <div class="form-group" style="margin-bottom:0;">
                  <label class="form-label" style="font-size:0.75rem;">Payment Method</label>
                  <select id="filter-method" class="form-select">
                    <option value="">All Methods</option>
                    <option value="Cash">Cash (રોકડ)</option>
                    <option value="UPI">UPI (Google Pay / PhonePe)</option>
                    <option value="Online">Online / Portal</option>
                    <option value="Udhar">Udhar (બાકી)</option>
                    <option value="Bank Transfer">Bank Transfer</option>
                  </select>
                </div>
                <div class="form-group" style="margin-bottom:0;">
                  <label class="form-label" style="font-size:0.75rem;">Min Amount (₹)</label>
                  <input type="number" id="filter-min-amt" class="form-control font-tabular" placeholder="Min ₹" />
                </div>
                <div class="form-group" style="margin-bottom:0;">
                  <label class="form-label" style="font-size:0.75rem;">Max Amount (₹)</label>
                  <input type="number" id="filter-max-amt" class="form-control font-tabular" placeholder="Max ₹" />
                </div>
              </div>

              <!-- Date & Reset Row -->
              <div class="trans-date-row" style="display:flex; flex-wrap:wrap; gap:0.75rem; margin-top:0.85rem; align-items:center; justify-content:space-between; border-top:1px solid var(--border-subtle); padding-top:0.75rem;">
                <div style="display:flex; flex-wrap:wrap; gap:0.65rem; align-items:center;">
                  <select id="filter-preset" class="form-select" style="width:auto; padding:0.4rem 0.75rem; font-size:0.825rem; font-weight:600;">
                    <option value="all" selected>All Dates</option>
                    <option value="today">Today</option>
                    <option value="yesterday">Yesterday</option>
                    <option value="this_week">This Week</option>
                    <option value="this_month">This Month</option>
                    <option value="this_year">This Year</option>
                    <option value="custom">Custom Date Range</option>
                  </select>
                  <div id="custom-date-box" style="display:none; align-items:center; gap:0.35rem;">
                    <input type="date" id="filter-date-from" class="form-control" style="width:130px; font-size:0.775rem; padding:0.35rem;" />
                    <span style="color:var(--text-dim);">-</span>
                    <input type="date" id="filter-date-to" class="form-control" style="width:130px; font-size:0.775rem; padding:0.35rem;" />
                  </div>
                </div>
                <button class="btn btn-outline btn-sm" id="btn-reset-filters" style="font-size:0.775rem; padding:0.35rem 0.65rem;">Reset Filters</button>
              </div>
            </div>
          </div>
        </div>

        <!-- Ledger Table & Mobile Card Feed -->
        <div class="card">
          <div class="card-header">
            <div style="display:flex; align-items:center; gap:0.75rem;">
              <h2 class="card-title">Transaction Ledger Records</h2>
              <span id="trans-count-badge" class="badge badge-waiting font-tabular">0 Records</span>
            </div>
          </div>
          <div class="table-container hide-on-mobile">
            <table class="data-table">
              <thead>
                <tr>
                  <th style="width:130px; min-width:130px; white-space:nowrap;">Date & Time</th>
                  <th style="width:105px; min-width:105px; white-space:nowrap;">Type</th>
                  <th style="min-width:160px;">Citizen / Vendor</th>
                  <th style="min-width:200px;">Service / Expense Details</th>
                  <th style="width:115px; min-width:115px; white-space:nowrap;">Method</th>
                  <th style="width:125px; min-width:125px; white-space:nowrap;">Reference / Receipt</th>
                  <th style="width:110px; min-width:110px; text-align:right; white-space:nowrap;">Amount (₹)</th>
                  <th style="width:135px; min-width:135px; text-align:right; white-space:nowrap;">Actions</th>
                </tr>
              </thead>
              <tbody id="transactions-table-body">
                <tr><td colspan="8" style="text-align:center; padding:3rem; color:var(--text-muted);">Loading transactions...</td></tr>
              </tbody>
            </table>
          </div>
          <!-- Mobile Adaptive Feed Cards -->
          <div class="mobile-card-list" id="mobile-trans-list" style="padding:0.75rem;"></div>
        </div>
      </main>
    </div>
  </div>

  <div id="mobile-bottom-nav-container"></div>
  <div id="modal-container"></div>
  <div id="notification-container"></div>

  <script type="module" src="/js/app.js?v=2.2"></script>
  <script type="module" src="/js/transactions.js?v=2.2"></script>
</body>
</html>
