<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Applications — VCE Pali e-Gram</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link rel="apple-touch-icon" href="/assets/vce-icon-256.png" />
  <!-- Curated Google Fonts: Plus Jakarta Sans + Inter + JetBrains Mono + Noto Sans Gujarati -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Noto+Sans+Gujarati:wght@500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/reset.css" />
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/animations.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
  <link rel="stylesheet" href="/css/print.css" />
  <script>
    (function() {
      const saved = localStorage.getItem('vce_theme');
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = saved || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
      if (typeof window.AndroidBridge !== 'undefined' || navigator.userAgent.includes('VCE-Android-Native') || window.location.search.includes('native=true')) {
        document.documentElement.classList.add('is-native-app');
      }
    })();
  </script>
</head>
<body data-page="work">
  <div class="app-container">
    <div id="sidebar-container"></div>

    <div class="main-wrapper">
      <header class="topbar">
        <div class="topbar-left">
          <div class="topbar-title-group">
            <h1 class="topbar-title">Applications <span class="desktop-only-inline">&amp; Services</span></h1>
            <span class="topbar-subtitle">Token tracking, service delivery, and fee collection ledger</span>
          </div>
        </div>
        <div class="topbar-right">
          <button class="btn-theme-toggle" id="btn-theme-switch-top" title="Toggle Theme" aria-label="Toggle Theme">
            <span class="theme-icon sun-icon">☀️</span>
            <span class="theme-icon moon-icon">🌙</span>
            <span class="theme-text">Mode</span>
          </button>
          <button class="btn btn-primary" id="btn-add-work-top" style="font-weight:700;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span>New Application</span>
          </button>
        </div>
      </header>

      <main class="content-area">
        <!-- Filter and Search Bar -->
        <div class="card" style="margin-bottom:1.65rem;">
          <div class="card-body filter-bar-shell" style="display:flex; flex-wrap:wrap; gap:1.15rem; align-items:center; justify-content:space-between; padding:1.25rem 1.65rem;">
            <div style="flex:1; min-width:260px; position:relative;">
              <input type="text" id="work-search-input" class="form-control" placeholder="Search citizen, token (TK-...), village, or service..." style="padding-left:2.6rem;" />
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2" style="position:absolute; left:0.95rem; top:50%; transform:translateY(-50%); pointer-events:none;"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </div>
            <div style="display:flex; flex-wrap:wrap; gap:0.75rem; width:100%; max-width:480px;">
              <select id="work-status-filter" class="form-select" style="flex:1; min-width:140px; padding:0.55rem 0.95rem; font-size:0.85rem; font-weight:600;">
                <option value="">All Statuses</option>
                <option value="New">New</option>
                <option value="In Progress">In Progress</option>
                <option value="Pending Approval">Pending Approval</option>
                <option value="Ready / Printed">Ready / Printed</option>
                <option value="Completed / Delivered">Completed / Delivered</option>
                <option value="Cancelled / Rejected">Cancelled / Rejected</option>
              </select>
              <select id="work-category-filter" class="form-select" style="flex:1; min-width:140px; padding:0.55rem 0.95rem; font-size:0.85rem; font-weight:600;">
                <option value="">All Services</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Work Table & Mobile Card Feed -->
        <div class="card">
          <div class="card-header">
            <div style="display:flex; align-items:center; gap:0.75rem;">
              <h2 class="card-title">Applications Ledger</h2>
              <span id="work-count-badge" class="badge badge-waiting font-tabular">0 Applications</span>
            </div>
          </div>
          <div class="table-container hide-on-mobile">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Token No.</th>
                  <th>Citizen & Village</th>
                  <th>Service & Portal</th>
                  <th>Status</th>
                  <th>Date</th>
                  <th style="text-align:right;">Total Fee</th>
                  <th style="text-align:right;">Received</th>
                  <th style="text-align:right;">Pending (Udhar)</th>
                  <th style="text-align:center;">Actions</th>
                </tr>
              </thead>
              <tbody id="work-table-body">
                <tr><td colspan="9" style="text-align:center; padding:3rem; color:var(--text-muted);">Loading applications...</td></tr>
              </tbody>
            </table>
          </div>
          <!-- Mobile Adaptive Feed Cards -->
          <div class="mobile-card-list" id="mobile-work-list" style="padding:0.75rem;"></div>
        </div>
      </main>
    </div>
  </div>

  <!-- Work Timeline Modal -->
  <div class="modal-backdrop" id="modal-work-timeline">
    <div class="modal-dialog" style="max-width:720px;">
      <div class="modal-header">
        <div style="display:flex; align-items:center; gap:0.6rem;">
          <div style="width:10px; height:10px; border-radius:50%; background:var(--accent);"></div>
          <h3 class="modal-title" id="timeline-work-title" style="margin:0;">Application Details & Payment History</h3>
        </div>
        <button class="modal-close" data-dismiss="modal">✕</button>
      </div>
      <div class="modal-body" id="timeline-modal-body">
        <!-- Injected via JS -->
      </div>
      <div class="modal-footer" style="display:flex; justify-content:space-between;">
        <button class="btn btn-outline" id="btn-print-token-receipt">Print Token Receipt</button>
        <button class="btn btn-outline" data-dismiss="modal">Close</button>
      </div>
    </div>
  </div>

  <div id="mobile-bottom-nav-container"></div>
  <div id="modal-container"></div>
  <div id="notification-container"></div>

  <script type="module" src="/js/app.js"></script>
  <script type="module" src="/js/work.js"></script>
</body>
</html>
