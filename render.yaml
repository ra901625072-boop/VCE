# ==============================================================================
# Render Blueprint Specification — VCE Pali Backend Service
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================
services:
  - type: web
    name: vce-pali-backend
    env: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: APP_NAME
        value: "VCE Pali — e-Gram Seva & Financial Ledger"
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        value: "y8t79YBtdO3lnInztvHnSqGPBBG8PGuSBStYReZ14GPsAASEJeyT6a7zseaqQOQK"
      - key: BACKEND_URL
        value: "https://vce-pali-backend.onrender.com"

      - key: TIMEZONE
        value: "Asia/Kolkata"
      - key: CURRENCY_SYMBOL
        value: "₹"
      - key: CORS_ORIGINS
        value: "*"
      - key: DEFAULT_OPERATOR_ID
        value: akrajput2005
      - key: DEFAULT_OPERATOR_PASS
        sync: false
      - key: FRONTEND_URL
        value: "https://vce-xi.vercel.app"
      - key: SERVE_FRONTEND
        value: "false"
      - key: DATABASE_URL
        value: "postgresql://postgres.nvoikqwbtwtvybjsssss:Akshay%40161005@aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres"


